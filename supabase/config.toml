# Function flags for the hosted project.
project_id = "vhvlkerectggovfihjgm"

# Hosted Auth password policy is applied by scripts/disable-auth-hibp.sh
# (Management API), not by this file. Keep these keys as the intended policy.
# New passwords need 12 characters, a lower letter, an upper letter, a digit,
# and a symbol. Leaked-password rejection stays off.
[auth]
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[functions.gi-daily-sales-mail]
verify_jwt = false


[functions.gi-provision-agent-auth]
verify_jwt = false

[functions.gi-open-agent-session]
verify_jwt = false

[functions.gi-sign]
verify_jwt = false

# Personal-area one-time email code. Customers have no agent JWT.
[functions.gi-portal-code]
verify_jwt = false

# Agent login code. The caller has no session yet. Mail leaves from the
# daily-sales Outlook mailbox, not from the cancellation Gmail account.
[functions.gi-login-mail-code]
verify_jwt = false

# Phone lock-screen alerts. GitHub keeps the VAPID key and deploys this
# function. pg_cron calls it once a minute when that extension is installed.
[functions.onyx-phone-push]
verify_jwt = false

# Postal code lookup. The wizard has no user JWT while the form is open.
[functions.gi-zip]
verify_jwt = false
