# Minimal config so the reconstructed daily-sales mail function can be deployed.
# gi-daily-sales-mail is NOT deployed by .github/workflows/deploy-assistant.yml.
# .github/workflows/daily-sales-mail.yml deploys it on push to main, and is
# also the 12:30 / 15:00 / 20:00 Israel clock. Manual deploy:
#   supabase functions deploy gi-daily-sales-mail --project-ref vhvlkerectggovfihjgm --no-verify-jwt
project_id = "vhvlkerectggovfihjgm"

# Hosted Auth password policy is applied by scripts/disable-auth-hibp.sh
# (Management API), not by this file. Keep these keys as the intended policy:
# Studio must accept leaked/weak passwords when creating users.
[auth]
minimum_password_length = 6
password_requirements = ""

[functions.gi-daily-sales-mail]
verify_jwt = false

[functions.gi-assistant-pairing]
verify_jwt = false

[functions.gi-assistant-realtime]
verify_jwt = false

[functions.gi-assistant-engine]
verify_jwt = false

[functions.gi-assistant-tools]
verify_jwt = false

[functions.gi-provision-agent-auth]
verify_jwt = false

[functions.gi-open-agent-session]
verify_jwt = false

[functions.gi-sign]
verify_jwt = false

# Personal-area one-time email code. Customers have no agent JWT.
[functions.gi-portal-code]
verify_jwt = false

# Phone lock-screen alerts. GitHub keeps the VAPID key and deploys this
# function. pg_cron calls it once a minute when that extension is installed.
[functions.onyx-phone-push]
verify_jwt = false
