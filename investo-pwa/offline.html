<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#002147"/>
  <title>INVESTO — אין חיבור</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:Rubik,Segoe UI,sans-serif;background:#002147;color:#fff;
      padding:24px;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
      text-align:center;
    }
    .card{max-width:360px}
    h1{font-size:1.4rem;margin:0 0 12px;color:#E8C547}
    p{opacity:.88;line-height:1.6;margin:0 0 20px}
    button{
      border:0;border-radius:14px;padding:14px 24px;font:inherit;font-weight:700;
      background:linear-gradient(135deg,#E8C547,#B8860B);color:#001F3F;cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>INVESTO</h1>
    <p>אין חיבור לאינטרנט כרגע. בדוק את הרשת ונסה שוב.</p>
    <button type="button" onclick="location.reload()">נסה שוב</button>
  </div>
</body>
</html>
