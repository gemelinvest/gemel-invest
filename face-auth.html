<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#3870ED"/>
<title>זיהוי פנים — גמל אינווסט</title>
<style>
  :root{
    --brand:#2563EB;
    --brand-deep:#3870ED;
    --bg:#eef3fb;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --ok:#15803d;
    --err:#b91c1c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Heebo,Rubik,Arial,sans-serif}
  body{padding:calc(12px + var(--safe-top)) 16px calc(24px + var(--safe-bottom))}
  .wrap{max-width:420px;margin:0 auto;position:relative}
  .top{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    min-height:48px;
    margin-bottom:12px;
  }
  .logo{
    width:72px;height:auto;display:block;
    object-fit:contain;
    background:transparent;
  }
  .stage{
    position:relative;border-radius:22px;overflow:hidden;background:#0b1220;
    aspect-ratio:3/4;
    border:1px solid #dbe4f5;
  }
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#0b1220}
  .guide{
    position:absolute;inset:12% 16%;border:3px solid rgba(255,255,255,.72);border-radius:50%;
    pointer-events:none;box-shadow:0 0 0 999px rgba(8,15,32,.38);
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .guide.is-lock{
    border-color:#4ade80;
    box-shadow:0 0 0 999px rgba(8,15,32,.28);
  }
  .lockTag{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(15,23,42,.72);color:#fff;font-size:12px;font-weight:700;
    padding:6px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;
  }
  .lockTag.is-on{background:#15803d}
  .card{background:var(--card);color:var(--text);border-radius:18px;padding:16px;margin-top:14px;border:1px solid #e2e8f0}
  .status{font-size:15px;color:var(--muted);min-height:1.4em;font-weight:700}
  .status.is-ok{color:var(--ok)}
  .status.is-err{color:var(--err)}
  .steps{display:flex;gap:6px;margin:4px 0 12px}
  .steps span{flex:1;height:7px;border-radius:99px;background:#e2e8f0}
  .steps span.is-on{background:var(--brand)}
  .steps span.is-done{background:#22c55e}
  button{
    width:100%;min-height:48px;border:0;border-radius:12px;background:var(--brand);color:#fff;
    font-weight:800;font-size:16px;cursor:pointer;margin-top:10px
  }
  button:disabled{opacity:.55;cursor:default}
  button.secondary{background:#e8eef8;color:#0f172a}
  .hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
  button.retry{
    background:#0f172a;
  }
  .success{
    display:none;
    position:fixed;
    inset:0;
    z-index:80;
    margin:0;
    border:0;
    border-radius:0;
    background:var(--bg);
    padding:calc(24px + var(--safe-top)) 24px calc(28px + var(--safe-bottom));
    text-align:center;
    align-items:center;
    justify-content:center;
    flex-direction:column;
  }
  .success.is-on{display:flex}
  .success .box{
    width:min(360px,100%);
    background:var(--card);
    border:1px solid #e2e8f0;
    border-radius:28px;
    padding:40px 24px 32px;
    box-shadow:0 18px 50px rgba(15,23,42,.12);
  }
  .success .mark{
    width:76px;height:76px;border-radius:50%;margin:0 auto 16px;
    background:#dcfce7;color:#15803d;display:flex;align-items:center;justify-content:center;
    font-size:38px;font-weight:800;line-height:1;
  }
  .success .title{font-size:22px;font-weight:800;margin:0 0 8px;color:var(--text)}
  .success .sub{font-size:15px;color:var(--muted);margin:0;line-height:1.5;font-weight:600}
  body.is-success{overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="logo" src="./assets/onyx-logo-light.png?v=onyx-mark-1" alt="ONYX CRM" width="1262" height="981"/>
  </div>
  <div class="stage" id="stage">
    <video id="cam" playsinline autoplay muted></video>
    <div class="guide" id="guide" aria-hidden="true"></div>
    <div class="lockTag" id="lockTag">ממקמים את הפנים במרכז</div>
  </div>
  <div class="card" id="card">
    <div class="steps" id="steps" hidden>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="status" id="status">בודק הרשאות…</div>
    <button type="button" id="btnCapture" hidden>צלמו עכשיו</button>
    <button type="button" id="btnConfirm" hidden>אישור וסיום</button>
    <button type="button" id="btnRetry" class="retry" hidden>איפוס מצלמה וסריקה מחדש</button>
    <div class="hint" id="hint"></div>
  </div>
  <div class="success" id="success">
    <div class="box">
      <div class="mark" aria-hidden="true">✓</div>
      <p class="title" id="successTitle">החיבור הצליח</p>
      <p class="sub" id="successSub">המערכת עולה במחשב. אפשר לסגור את החלון בטלפון.</p>
    </div>
  </div>
</div>
<script type="module">
const SUPABASE_URL = "https://vhvlkerectggovfihjgm.supabase.co";
const SUPABASE_KEY = "sb_publishable_JixJJelGPWcP0BPKGq96Lw_nIiMyIBb";
const FN = SUPABASE_URL + "/functions/v1/gi-face-auth";
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/";
const ENROLL_PROMPTS = [
  "הסתכלו ישר למצלמה",
  "פנו מעט שמאלה",
  "פנו מעט ימינה",
  "שוב ישר למצלמה"
];
const LOGIN_PROMPTS = [
  "הסתכלו ישר למצלמה",
  "פנו מעט הצידה"
];

const token = new URLSearchParams(location.search).get("t") || "";
const els = {
  status: document.getElementById("status"),
  hint: document.getElementById("hint"),
  steps: document.getElementById("steps"),
  btnCapture: document.getElementById("btnCapture"),
  btnConfirm: document.getElementById("btnConfirm"),
  btnRetry: document.getElementById("btnRetry"),
  cam: document.getElementById("cam"),
  guide: document.getElementById("guide"),
  lockTag: document.getElementById("lockTag"),
  stage: document.getElementById("stage"),
  card: document.getElementById("card"),
  success: document.getElementById("success"),
  successTitle: document.getElementById("successTitle"),
  successSub: document.getElementById("successSub")
};

const CAM_OK_KEY = "giFaceCamOk";
let kind = "login";
let modelsReady = false;
let stream = null;
let flowBusy = false;
const descriptors = [];

function sleep(ms){
  return new Promise((resolve) => window.setTimeout(resolve, ms));
}
function setStatus(text, tone){
  els.status.textContent = text || "";
  els.status.className = "status" + (tone ? " is-" + tone : "");
}
function setHint(text){ els.hint.textContent = text || ""; }
function setLock(on, label){
  els.guide.classList.toggle("is-lock", !!on);
  els.lockTag.classList.toggle("is-on", !!on);
  els.lockTag.textContent = label || (on ? "הפנים ננעלו · החזיקו יציב" : "ממקמים את הפנים במרכז");
}
function stopCamera(){
  try {
    (stream ? stream.getTracks() : []).forEach((t) => { try { t.stop(); } catch(_e) {} });
  } catch(_e) {}
  stream = null;
  try {
    els.cam.pause();
    els.cam.srcObject = null;
  } catch(_e) {}
}
function markCameraOk(){
  try { localStorage.setItem(CAM_OK_KEY, "1"); } catch(_e) {}
}
function rememberedCameraOk(){
  try { return localStorage.getItem(CAM_OK_KEY) === "1"; } catch(_e) { return false; }
}
function cameraTrackLive(){
  return !!(stream && stream.getVideoTracks().some((t) => t.readyState === "live"));
}
function showWorkUi(){
  try { document.body.classList.remove("is-success"); } catch(_e) {}
  if(els.success) els.success.classList.remove("is-on");
  if(els.stage) els.stage.hidden = false;
  if(els.card) els.card.hidden = false;
  if(els.btnRetry){
    els.btnRetry.hidden = true;
    els.btnRetry.disabled = false;
  }
}
function showRetry(message){
  try { document.body.classList.remove("is-success"); } catch(_e) {}
  if(els.success) els.success.classList.remove("is-on");
  if(els.stage) els.stage.hidden = false;
  if(els.card) els.card.hidden = false;
  if(els.btnCapture) els.btnCapture.hidden = true;
  if(els.btnConfirm) els.btnConfirm.hidden = true;
  setLock(false);
  setStatus(message || "הזיהוי לא הצליח. אפשר לסרוק שוב.", "err");
  setHint("לחצו לאיפוס המצלמה וסריקה מחדש.");
  if(els.btnRetry){
    els.btnRetry.hidden = false;
    els.btnRetry.disabled = false;
    els.btnRetry.textContent = "איפוס מצלמה וסריקה מחדש";
  }
}
function showConnected(title, sub){
  stopCamera();
  setLock(false);
  if(els.stage) els.stage.hidden = true;
  if(els.card) els.card.hidden = true;
  if(els.btnRetry) els.btnRetry.hidden = true;
  if(els.successTitle) els.successTitle.textContent = title || "החיבור הצליח";
  if(els.successSub) els.successSub.textContent = sub || "המערכת עולה במחשב. אפשר לסגור את החלון בטלפון.";
  if(els.success) els.success.classList.add("is-on");
  try { document.body.classList.add("is-success"); } catch(_e) {}
}

async function callFn(payload){
  const res = await fetch(FN, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  });
  let data = null;
  try { data = await res.json(); } catch(_e) { data = {}; }
  if(!res.ok || data?.ok === false){
    const err = new Error(data?.error || ("HTTP_" + res.status));
    err.code = data?.error || "";
    throw err;
  }
  return data;
}

function deviceLabelFromUa(ua){
  const s = String(ua || "");
  if(/iPhone|iPad|iPod/i.test(s)) return "iPhone";
  if(/Android/i.test(s)) return "Android";
  if(/Mobile/i.test(s)) return "טלפון";
  return "טלפון";
}

function paintSteps(){
  const dots = [...els.steps.querySelectorAll("span")];
  dots.forEach((el, i) => {
    el.classList.toggle("is-done", i < descriptors.length);
    el.classList.toggle("is-on", i === descriptors.length);
  });
}

async function loadModels(){
  const faceapi = await import("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.esm.js");
  window.__faceapi = faceapi;
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
  ]);
  modelsReady = true;
}

async function applyFocus(track){
  if(!track) return;
  try {
    const caps = track.getCapabilities ? (track.getCapabilities() || {}) : {};
    if(Array.isArray(caps.focusMode) && caps.focusMode.includes("continuous")){
      await track.applyConstraints({ focusMode: "continuous" });
      return;
    }
  } catch(_e) {}
  try {
    await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
  } catch(_e) {}
}

async function startCamera(){
  if(cameraTrackLive()){
    if(els.cam.srcObject !== stream) els.cam.srcObject = stream;
    await els.cam.play().catch(() => {});
    return;
  }
  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: "user" },
      width: { ideal: 640 },
      height: { ideal: 480 }
    },
    audio: false
  });
  markCameraOk();
  const track = stream.getVideoTracks()[0];
  await applyFocus(track);
  els.cam.srcObject = stream;
  await els.cam.play().catch(() => {});
  if(els.cam.readyState < 2){
    await Promise.race([
      new Promise((resolve) => { els.cam.onloadeddata = () => resolve(); }),
      sleep(700)
    ]);
  }
}

async function detectOnce(){
  const faceapi = window.__faceapi;
  if(!faceapi || !modelsReady) throw new Error("MODEL");
  const det = await faceapi
    .detectSingleFace(els.cam, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.38 }))
    .withFaceLandmarks(true)
    .withFaceDescriptor();
  if(!det || !det.descriptor) return null;
  if(Number(det.detection?.score) < 0.48) return null;
  return Array.from(det.descriptor);
}

async function captureWhenLocked(prompt, timeoutMs, opts){
  setStatus(prompt);
  setLock(false);
  const started = Date.now();
  const limit = Math.max(4000, Number(timeoutMs) || 12000);
  const confirmTwice = opts?.confirm !== false;
  while(Date.now() - started < limit){
    try {
      const desc = await detectOnce();
      if(desc){
        setLock(true);
        if(!confirmTwice){
          setLock(true, "נשמר");
          return desc;
        }
        await sleep(60);
        const again = await detectOnce();
        if(again){
          setLock(true, "נשמר");
          return again;
        }
      } else {
        setLock(false);
      }
    } catch(_e) {
      setLock(false);
    }
  }
  setLock(false);
  throw new Error("NO_FACE");
}

async function submitAll(){
  els.btnCapture.disabled = true;
  els.btnConfirm.disabled = true;
  setStatus("שולח לאימות…");
  const data = await callFn({
    action: "submit",
    publicToken: token,
    descriptors,
    deviceLabel: deviceLabelFromUa(navigator.userAgent),
    geoText: ""
  });
  const st = String(data?.status || "");
  if(kind === "enroll"){
    if(st && st !== "enrolled"){
      const err = new Error(st);
      err.code = st;
      throw err;
    }
  } else if(st && st !== "approved"){
    const err = new Error(st);
    err.code = st === "denied" ? "NO_MATCH" : st;
    throw err;
  }
  return data;
}

function showEnrollUi(){
  els.steps.hidden = false;
  els.btnCapture.hidden = true;
  els.btnConfirm.hidden = false;
  els.btnConfirm.disabled = true;
  paintSteps();
  setHint("הזיזו מעט בין הזוויות. התמונות לא נשמרות — רק חתימה מספרית.");
  const runNext = async () => {
    if(descriptors.length >= 4){
      els.btnConfirm.disabled = false;
      setStatus("מוכן לאישור", "ok");
      setLock(true, "מוכן");
      return;
    }
    paintSteps();
    try {
      const desc = await captureWhenLocked(ENROLL_PROMPTS[descriptors.length], 14000);
      descriptors.push(desc);
      paintSteps();
      if(descriptors.length < 4){
        setLock(false, "הזיזו מעט");
        await sleep(280);
      }
      await runNext();
    } catch(_e) {
      showRetry("לא זוהו פנים. נסו שוב בתאורה טובה.");
    }
  };
  els.btnCapture.onclick = async () => {
    els.btnCapture.hidden = true;
    await runNext();
  };
  els.btnConfirm.onclick = async () => {
    try {
      await submitAll();
      showConnected("נרשם בהצלחה", "אפשר לחזור למחשב.");
    } catch(err) {
      const code = String(err?.code || err?.message || "");
      els.btnConfirm.disabled = false;
      showRetry(code === "LIVENESS"
        ? "הסריקות דומות מדי או רחוקות מדי. הזיזו מעט את הראש בין הצילומים."
        : (code === "EXPIRED" || code === "SESSION_CLOSED")
          ? "הקוד פג במחשב. סרקו שוב את ה-QR."
          : ("ההרשמה נכשלה. נסו שוב" + (code ? " (" + code + ")" : "") + "."));
    }
  };
  void runNext();
}

function faceDistance(a, b){
  const left = Array.isArray(a) ? a : [];
  const right = Array.isArray(b) ? b : [];
  const n = Math.min(left.length, right.length);
  let sum = 0;
  for(let i = 0; i < n; i++){
    const delta = Number(left[i]) - Number(right[i]);
    sum += delta * delta;
  }
  return Math.sqrt(sum);
}

function faceVector(desc){
  const list = Array.isArray(desc) ? desc : [];
  if(list.length !== 128) return null;
  const out = [];
  for(let i = 0; i < 128; i++){
    const n = Number(list[i]);
    if(!Number.isFinite(n)) return null;
    out.push(n);
  }
  return out;
}

function faceNormalize(desc){
  const v = faceVector(desc);
  if(!v) return null;
  let sum = 0;
  for(let i = 0; i < v.length; i++) sum += v[i] * v[i];
  const len = Math.sqrt(sum);
  if(!(len > 0)) return null;
  return v.map((n) => n / len);
}

function faceBoxShift(a, b){
  const left = a && a.box;
  const right = b && b.box;
  if(!left || !right) return 0;
  const width = Number(left.width) || 0;
  if(!(width > 1)) return 0;
  const dx = (Number(right.x) + (Number(right.width) || 0) / 2) - (Number(left.x) + width / 2);
  const dy = (Number(right.y) + (Number(right.height) || 0) / 2) - (Number(left.y) + (Number(left.height) || 0) / 2);
  return Math.hypot(dx, dy) / width;
}

function facePickPair(samples){
  const list = (Array.isArray(samples) ? samples : []).filter((sample) => sample && faceVector(sample.descriptor) && Number(sample.score) >= 0.45);
  if(list.length < 2) return null;
  let best = null;
  let bestNeighbors = -1;
  for(let i = 0; i < list.length; i++){
    let neighbors = 0;
    for(let j = 0; j < list.length; j++){
      if(i === j) continue;
      if(faceDistance(list[i].descriptor, list[j].descriptor) <= 0.42) neighbors += 1;
    }
    if(!best || neighbors > bestNeighbors || (neighbors === bestNeighbors && list[i].score > best.score)){
      best = list[i];
      bestNeighbors = neighbors;
    }
  }
  if(!best || bestNeighbors < 1) return null;
  let second = null;
  for(let i = 0; i < list.length; i++){
    const sample = list[i];
    if(sample === best) continue;
    const dist = faceDistance(best.descriptor, sample.descriptor);
    const shift = faceBoxShift(best, sample);
    const timeGap = Math.abs((Number(sample.t) || 0) - (Number(best.t) || 0));
    const timed = timeGap >= 0.08 || (!(Number(best.t) > 0) && !(Number(sample.t) > 0));
    const live = timed && (dist >= 0.012 || shift >= 0.06);
    if(!live || dist > 0.42) continue;
    if(!second || sample.score > second.score) second = sample;
  }
  if(!second) return null;
  const primary = faceNormalize(best.descriptor);
  const other = faceNormalize(second.descriptor);
  if(!primary || !other) return null;
  return [primary, other];
}

async function detectLoginSample(){
  const faceapi = window.__faceapi;
  if(!faceapi || !modelsReady) throw new Error("MODEL");
  if(!(els.cam.videoWidth > 0)) return null;
  const det = await faceapi
    .detectSingleFace(els.cam, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.38 }))
    .withFaceLandmarks(true)
    .withFaceDescriptor();
  if(!det || !det.descriptor) return null;
  const score = Number(det.detection?.score);
  if(!(score >= 0.42)) return null;
  const box = det.detection?.box;
  return {
    descriptor: Array.from(det.descriptor),
    score,
    t: Number(els.cam.currentTime) > 0 ? Number(els.cam.currentTime) : 0,
    box: box ? { x: Number(box.x) || 0, y: Number(box.y) || 0, width: Number(box.width) || 0, height: Number(box.height) || 0 } : null
  };
}

async function scanLoginPair(){
  const samples = [];
  const started = Date.now();
  let sawFace = false;
  setStatus("ממקמים את הפנים במרכז");
  while(Date.now() - started < 12000){
    let sample = null;
    try { sample = await detectLoginSample(); }
    catch(err){
      if(String(err && (err.code || err.message) || "") === "MODEL") throw err;
    }
    if(!sample){
      setLock(false);
      setStatus(sawFace ? "הפנים במרכז. הזיזו מעט את הראש" : "ממקמים את הפנים במרכז");
      await sleep(90);
      continue;
    }
    sawFace = true;
    samples.push(sample);
    if(samples.length > 24) samples.shift();
    setLock(true, "זוהו פנים");
    const pair = facePickPair(samples);
    if(pair && Date.now() - started > 500){
      setStatus("הפנים זוהו", "ok");
      setLock(true, "הפנים זוהו");
      return pair;
    }
    setStatus("הפנים במרכז. הזיזו מעט את הראש");
    await sleep(90);
  }
  const err = new Error(sawFace ? "LIVENESS" : "NO_FACE");
  err.code = sawFace ? "LIVENESS" : "NO_FACE";
  throw err;
}

async function runLoginCapture(){
  setHint("ממקמים את הפנים במרכז. בלי לשמור תמונה.");
  let lastCode = "";
  for(let attempt = 0; attempt < 2; attempt++){
    descriptors.length = 0;
    try {
      if(attempt) setStatus("ממשיכים לזהות…");
      const pair = await scanLoginPair();
      descriptors.push(pair[0], pair[1]);
      setStatus("הפנים זוהו", "ok");
      const data = await submitAll();
      if(!data || data.ok === false){
        lastCode = "NO_MATCH";
        if(attempt === 0) continue;
        showRetry("הזיהוי לא הצליח. לחצו לסריקה מחדש.");
        return;
      }
      showConnected("החיבור הצליח", "המערכת עולה במחשב. אפשר לסגור את החלון בטלפון.");
      return;
    } catch(err) {
      lastCode = String(err?.code || err?.message || "");
      if(lastCode === "NO_MATCH" && attempt === 0) continue;
      if(lastCode === "NO_FACE") showRetry("לא זוהו פנים. לחצו לסריקה מחדש.");
      else if(lastCode === "NO_MATCH") showRetry("הפנים לא זוהו. לחצו לאיפוס מצלמה וסריקה מחדש.");
      else if(lastCode === "EXPIRED" || lastCode === "SESSION_CLOSED") showRetry("הקוד פג. סרקו שוב את ה-QR במחשב, או לחצו לניסיון נוסף.");
      else if(lastCode === "LIVENESS") showRetry("הסריקה נראתה סטטית. לחצו לסריקה מחדש מול המצלמה.");
      else showRetry("האימות נכשל. לחצו לסריקה מחדש.");
      return;
    }
  }
  if(lastCode === "NO_MATCH") showRetry("הפנים לא זוהו. לחצו לאיפוס מצלמה וסריקה מחדש.");
}

async function startFaceFlow(){
  showWorkUi();
  setStatus("פותחים מצלמה…");
  setHint(kind === "enroll"
    ? "הזיזו מעט בין הזוויות. התמונות לא נשמרות."
    : "ממקמים את הפנים במרכז. בלי לשמור תמונה.");
  await Promise.all([startCamera(), loadModels()]);
  if(kind === "enroll") showEnrollUi();
  else await runLoginCapture();
}

async function resetCameraAndRescan(){
  if(flowBusy) return;
  flowBusy = true;
  if(els.btnRetry) els.btnRetry.disabled = true;
  descriptors.length = 0;
  showWorkUi();
  setStatus("מאפסים מצלמה…");
  setHint("ממקמים את הפנים במרכז.");
  stopCamera();
  try {
    await startCamera();
    if(!modelsReady) await loadModels();
    if(kind === "enroll") showEnrollUi();
    else await runLoginCapture();
  } catch(err) {
    const perm = String(err).includes("NotAllowedError") || String(err?.name || "") === "NotAllowedError";
    showRetry(perm ? "יש לאפשר מצלמה בדפדפן ואז ללחוץ שוב." : "לא ניתן לפתוח מצלמה. לחצו שוב.");
  } finally {
    flowBusy = false;
    if(els.btnRetry) els.btnRetry.disabled = false;
  }
}

function isPermissionErr(err){
  return String(err).includes("NotAllowedError")
    || String(err).includes("Permission")
    || String(err?.name || "") === "NotAllowedError";
}

async function boot(){
  if(!token){
    setStatus("חסר קוד סריקה.", "err");
    setHint("סרקו את ה-QR ממסך הכניסה או מתפריט המשתמש.");
    return;
  }
  if(els.btnRetry){
    els.btnRetry.addEventListener("click", () => { void resetCameraAndRescan(); });
  }
  try {
    const peek = await callFn({ action: "peek", publicToken: token });
    kind = peek.kind === "enroll" ? "enroll" : "login";
    if(rememberedCameraOk()) setStatus("פותחים מצלמה…");
    await startFaceFlow();
  } catch(err) {
    const code = String(err?.code || err?.message || "");
    if(code === "EXPIRED" || code === "UNKNOWN_TOKEN") setStatus("הקוד פג או לא תקף. סרקו שוב.", "err");
    else if(isPermissionErr(err)){
      if(rememberedCameraOk()){
        showRetry("המצלמה כבר אושרה. לחצו לפתיחה מחדש בלי אישור נוסף.");
      } else {
        showRetry("יש לאשר גישה למצלמה פעם אחת, ואז ללחוץ כאן.");
      }
    }
    else setStatus("לא ניתן להתחיל. בדקו חיבור וסרקו שוב.", "err");
  }
}

window.addEventListener("pagehide", stopCamera);
boot();
</script>
