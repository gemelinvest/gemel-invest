<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#3870ED"/>
<title>זיהוי פנים — גמל אינווסט</title>
<style>
  :root{
    --brand:#2563EB;
    --brand-deep:#3870ED;
    --bg:#eef3fb;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --ok:#15803d;
    --err:#b91c1c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Heebo,Rubik,Arial,sans-serif}
  body{padding:calc(12px + var(--safe-top)) 16px calc(24px + var(--safe-bottom))}
  .wrap{max-width:420px;margin:0 auto;position:relative}
  .top{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    min-height:48px;
    margin-bottom:12px;
  }
  .logo{
    width:140px;height:auto;display:block;
    object-fit:contain;
  }
  .stage{
    position:relative;border-radius:22px;overflow:hidden;background:#0b1220;
    aspect-ratio:3/4;
    border:1px solid #dbe4f5;
  }
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#0b1220}
  .guide{
    position:absolute;inset:12% 16%;border:3px solid rgba(255,255,255,.72);border-radius:50%;
    pointer-events:none;box-shadow:0 0 0 999px rgba(8,15,32,.38);
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .guide.is-lock{
    border-color:#4ade80;
    box-shadow:0 0 0 999px rgba(8,15,32,.28);
  }
  .lockTag{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(15,23,42,.72);color:#fff;font-size:12px;font-weight:700;
    padding:6px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;
  }
  .lockTag.is-on{background:#15803d}
  .card{background:var(--card);color:var(--text);border-radius:18px;padding:16px;margin-top:14px;border:1px solid #e2e8f0}
  .status{font-size:15px;color:var(--muted);min-height:1.4em;font-weight:700}
  .status.is-ok{color:var(--ok)}
  .status.is-err{color:var(--err)}
  .steps{display:flex;gap:6px;margin:4px 0 12px}
  .steps span{flex:1;height:7px;border-radius:99px;background:#e2e8f0}
  .steps span.is-on{background:var(--brand)}
  .steps span.is-done{background:#22c55e}
  button{
    width:100%;min-height:48px;border:0;border-radius:12px;background:var(--brand);color:#fff;
    font-weight:800;font-size:16px;cursor:pointer;margin-top:10px
  }
  button:disabled{opacity:.55;cursor:default}
  button.secondary{background:#e8eef8;color:#0f172a}
  .hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="logo" src="./logo-login-clean.png" alt="גמל אינווסט" width="1808" height="373"/>
  </div>
  <div class="stage">
    <video id="cam" playsinline autoplay muted></video>
    <div class="guide" id="guide" aria-hidden="true"></div>
    <div class="lockTag" id="lockTag">ממקמים את הפנים במרכז</div>
  </div>
  <div class="card">
    <div class="steps" id="steps" hidden>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="status" id="status">בודק הרשאות…</div>
    <button type="button" id="btnGeo" hidden>אשר מיקום והמשך</button>
    <button type="button" id="btnCapture" hidden>צלמו עכשיו</button>
    <button type="button" id="btnConfirm" hidden>אישור וסיום</button>
    <div class="hint" id="hint"></div>
  </div>
</div>
<script type="module">
const SUPABASE_URL = "https://vhvlkerectggovfihjgm.supabase.co";
const SUPABASE_KEY = "sb_publishable_JixJJelGPWcP0BPKGq96Lw_nIiMyIBb";
const FN = SUPABASE_URL + "/functions/v1/gi-face-auth";
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/";
const ENROLL_PROMPTS = [
  "הסתכלו ישר למצלמה",
  "פנו מעט שמאלה",
  "פנו מעט ימינה",
  "שוב ישר למצלמה"
];
const LOGIN_PROMPTS = [
  "הסתכלו ישר למצלמה",
  "פנו מעט הצידה",
  "שוב ישר למצלמה"
];

const token = new URLSearchParams(location.search).get("t") || "";
const els = {
  status: document.getElementById("status"),
  hint: document.getElementById("hint"),
  steps: document.getElementById("steps"),
  btnGeo: document.getElementById("btnGeo"),
  btnCapture: document.getElementById("btnCapture"),
  btnConfirm: document.getElementById("btnConfirm"),
  cam: document.getElementById("cam"),
  guide: document.getElementById("guide"),
  lockTag: document.getElementById("lockTag")
};

let kind = "login";
let modelsReady = false;
let stream = null;
let resolvedGeo = "";
const descriptors = [];

function sleep(ms){
  return new Promise((resolve) => window.setTimeout(resolve, ms));
}
function setStatus(text, tone){
  els.status.textContent = text || "";
  els.status.className = "status" + (tone ? " is-" + tone : "");
}
function setHint(text){ els.hint.textContent = text || ""; }
function setLock(on, label){
  els.guide.classList.toggle("is-lock", !!on);
  els.lockTag.classList.toggle("is-on", !!on);
  els.lockTag.textContent = label || (on ? "הפנים ננעלו · החזיקו יציב" : "ממקמים את הפנים במרכז");
}

async function callFn(payload){
  const res = await fetch(FN, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  });
  let data = null;
  try { data = await res.json(); } catch(_e) { data = {}; }
  if(!res.ok || data?.ok === false){
    const err = new Error(data?.error || ("HTTP_" + res.status));
    err.code = data?.error || "";
    throw err;
  }
  return data;
}

function deviceLabelFromUa(ua){
  const s = String(ua || "");
  if(/iPhone|iPad|iPod/i.test(s)) return "iPhone";
  if(/Android/i.test(s)) return "Android";
  if(/Mobile/i.test(s)) return "טלפון";
  return "טלפון";
}

function paintSteps(){
  const dots = [...els.steps.querySelectorAll("span")];
  dots.forEach((el, i) => {
    el.classList.toggle("is-done", i < descriptors.length);
    el.classList.toggle("is-on", i === descriptors.length);
  });
}

async function loadModels(){
  const faceapi = await import("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.esm.js");
  window.__faceapi = faceapi;
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
  ]);
  modelsReady = true;
}

async function applyFocus(track){
  if(!track) return;
  try {
    const caps = track.getCapabilities ? (track.getCapabilities() || {}) : {};
    if(Array.isArray(caps.focusMode) && caps.focusMode.includes("continuous")){
      await track.applyConstraints({ focusMode: "continuous" });
      return;
    }
  } catch(_e) {}
  try {
    await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
  } catch(_e) {}
}

async function startCamera(){
  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: "user" },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  });
  const track = stream.getVideoTracks()[0];
  await applyFocus(track);
  els.cam.srcObject = stream;
  await els.cam.play().catch(() => {});
  if(els.cam.readyState < 2){
    await Promise.race([
      new Promise((resolve) => { els.cam.onloadeddata = () => resolve(); }),
      sleep(900)
    ]);
  }
  await sleep(160);
}

async function detectOnce(){
  const faceapi = window.__faceapi;
  if(!faceapi || !modelsReady) throw new Error("MODEL");
  const det = await faceapi
    .detectSingleFace(els.cam, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.42 }))
    .withFaceLandmarks(true)
    .withFaceDescriptor();
  if(!det || !det.descriptor) return null;
  if(Number(det.detection?.score) < 0.52) return null;
  return Array.from(det.descriptor);
}

async function captureWhenLocked(prompt, timeoutMs){
  setStatus(prompt);
  setLock(false);
  const started = Date.now();
  const limit = Math.max(4000, Number(timeoutMs) || 12000);
  while(Date.now() - started < limit){
    try {
      const desc = await detectOnce();
      if(desc){
        setLock(true);
        await sleep(140);
        const again = await detectOnce();
        if(again){
          setLock(true, "נשמר");
          return again;
        }
      } else {
        setLock(false);
      }
    } catch(_e) {
      setLock(false);
    }
    await sleep(70);
  }
  setLock(false);
  throw new Error("NO_FACE");
}

async function requestGeo(){
  if(!navigator.geolocation) return "";
  const pos = await new Promise((resolve) => {
    const t = window.setTimeout(() => resolve(null), 15000);
    navigator.geolocation.getCurrentPosition(
      (p) => { window.clearTimeout(t); resolve(p); },
      () => { window.clearTimeout(t); resolve(null); },
      { enableHighAccuracy: false, timeout: 14000, maximumAge: 60000 }
    );
  });
  if(!pos?.coords) return "";
  const lat = Number(pos.coords.latitude);
  const lng = Number(pos.coords.longitude);
  if(!Number.isFinite(lat) || !Number.isFinite(lng)) return "";
  try {
    const url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lng) + "&zoom=12&accept-language=he";
    const ac = new AbortController();
    const t = window.setTimeout(() => ac.abort(), 4000);
    const res = await fetch(url, { headers: { Accept: "application/json" }, signal: ac.signal });
    window.clearTimeout(t);
    const data = await res.json();
    const a = data?.address || {};
    const city = a.city || a.town || a.village || a.municipality || a.state;
    if(city) return String(city);
  } catch(_e) {}
  return lat.toFixed(3) + "," + lng.toFixed(3);
}

function showGeoRetry(){
  els.btnGeo.hidden = false;
  els.btnGeo.disabled = false;
  els.btnGeo.textContent = "אשר מיקום והמשך";
}

async function submitAll(){
  if(!resolvedGeo){
    const err = new Error("GEO_REQUIRED");
    err.code = "GEO_REQUIRED";
    throw err;
  }
  els.btnCapture.disabled = true;
  els.btnConfirm.disabled = true;
  els.btnGeo.hidden = true;
  setStatus("שולח לאימות…");
  await callFn({
    action: "submit",
    publicToken: token,
    descriptors,
    deviceLabel: deviceLabelFromUa(navigator.userAgent),
    geoText: resolvedGeo
  });
}

function showEnrollUi(){
  els.steps.hidden = false;
  els.btnCapture.hidden = true;
  els.btnConfirm.hidden = false;
  els.btnConfirm.disabled = true;
  paintSteps();
  setHint("הזיזו מעט בין הזוויות. התמונות לא נשמרות — רק חתימה מספרית.");
  const runNext = async () => {
    if(descriptors.length >= 4){
      els.btnConfirm.disabled = false;
      setStatus("מוכן לאישור", "ok");
      setLock(true, "מוכן");
      return;
    }
    paintSteps();
    try {
      const desc = await captureWhenLocked(ENROLL_PROMPTS[descriptors.length], 14000);
      descriptors.push(desc);
      paintSteps();
      if(descriptors.length < 4){
        setLock(false, "הזיזו מעט");
        await sleep(280);
      }
      await runNext();
    } catch(_e) {
      setStatus("לא זוהו פנים. נסו שוב בתאורה טובה.", "err");
      els.btnCapture.hidden = false;
      els.btnCapture.disabled = false;
      els.btnCapture.textContent = "נסו שוב";
    }
  };
  els.btnCapture.onclick = async () => {
    els.btnCapture.hidden = true;
    await runNext();
  };
  els.btnConfirm.onclick = async () => {
    try {
      await submitAll();
      setStatus("נרשם בהצלחה. אפשר לחזור למחשב.", "ok");
      setHint("");
      els.btnConfirm.hidden = true;
      setLock(true, "נשמר");
    } catch(err) {
      const code = String(err?.code || err?.message || "");
      if(code === "LIVENESS") setStatus("הסריקות דומות מדי או רחוקות מדי. הזיזו מעט את הראש בין הצילומים.", "err");
      else if(code === "EXPIRED" || code === "SESSION_CLOSED") setStatus("הקוד פג במחשב. סרקו שוב את ה-QR.", "err");
      else if(code === "GEO_REQUIRED") setStatus("יש לאשר מיקום כדי להמשיך.", "err");
      else setStatus("ההרשמה נכשלה. נסו שוב" + (code ? " (" + code + ")" : "") + ".", "err");
      els.btnConfirm.disabled = false;
    }
  };
  void runNext();
}

async function runLoginCapture(){
  setHint("ממקמים את הפנים במרכז. בלי לשמור תמונה.");
  for(let i = 0; i < LOGIN_PROMPTS.length; i++){
    try {
      descriptors.push(await captureWhenLocked(LOGIN_PROMPTS[i] + " (" + (i + 1) + "/3)", 10000));
    } catch(_e) {
      setStatus("לא זוהו פנים. אפשר להיכנס עם PIN במחשב.", "err");
      return;
    }
    if(i < LOGIN_PROMPTS.length - 1){
      setLock(false, "הזיזו מעט");
      await sleep(220);
    }
  }
  try {
    await submitAll();
    setStatus("אומת. המחשב ייכנס למערכת.", "ok");
    setHint("אפשר לסגור את החלון בטלפון.");
    setLock(true, "אומת");
  } catch(err) {
    const code = String(err?.code || err?.message || "");
    if(code === "NO_MATCH") setStatus("הפנים לא זוהו. היכנסו עם שם משתמש ו-PIN במחשב.", "err");
    else if(code === "EXPIRED" || code === "SESSION_CLOSED") setStatus("הקוד פג. סרקו שוב מהמסך.", "err");
    else if(code === "LIVENESS") setStatus("הסריקה נראתה סטטית. נסו שוב מול המצלמה.", "err");
    else if(code === "GEO_REQUIRED") setStatus("יש לאשר מיקום כדי להמשיך.", "err");
    else setStatus("האימות נכשל. PIN עדיין זמין במחשב.", "err");
  }
}

async function startFaceFlow(){
  setStatus("פותחים מצלמה…");
  setHint(kind === "enroll"
    ? "הזיזו מעט בין הזוויות. התמונות לא נשמרות."
    : "ממקמים את הפנים במרכז. בלי לשמור תמונה.");
  await Promise.all([startCamera(), loadModels()]);
  if(kind === "enroll") showEnrollUi();
  else await runLoginCapture();
}

async function boot(){
  if(!token){
    setStatus("חסר קוד סריקה.", "err");
    setHint("סרקו את ה-QR ממסך הכניסה או מתפריט המשתמש.");
    return;
  }
  try {
    const peek = await callFn({ action: "peek", publicToken: token });
    kind = peek.kind === "enroll" ? "enroll" : "login";
    setStatus("יש לאשר מיקום כדי להמשיך");
    setHint("בלי אישור מיקום לא ניתן לבצע זיהוי פנים. המיקום נשמר בלוג הפעילות.");
    const geo = await requestGeo();
    if(!geo){
      setStatus("יש לאשר מיקום כדי להמשיך.", "err");
      showGeoRetry();
      return;
    }
    resolvedGeo = geo;
    els.btnGeo.hidden = true;
    await startFaceFlow();
  } catch(err) {
    const code = String(err?.code || err?.message || "");
    if(code === "EXPIRED" || code === "UNKNOWN_TOKEN") setStatus("הקוד פג או לא תקף. סרקו שוב.", "err");
    else if(String(err).includes("NotAllowedError") || String(err).includes("Permission") || String(err?.name || "") === "NotAllowedError") setStatus("יש לאשר גישה למצלמה.", "err");
    else setStatus("לא ניתן להתחיל. בדקו חיבור וסרקו שוב.", "err");
  }
}

els.btnGeo.onclick = async () => {
  els.btnGeo.disabled = true;
  setStatus("מבקשים מיקום…");
  const geo = await requestGeo();
  if(!geo){
    setStatus("המיקום לא אושר. יש לאשר כדי להמשיך.", "err");
    els.btnGeo.disabled = false;
    showGeoRetry();
    return;
  }
  resolvedGeo = geo;
  els.btnGeo.hidden = true;
  try {
    await startFaceFlow();
  } catch(err) {
    const code = String(err?.code || err?.message || "");
    if(String(err).includes("NotAllowedError") || String(err).includes("Permission") || String(err?.name || "") === "NotAllowedError") setStatus("יש לאשר גישה למצלמה.", "err");
    else setStatus("לא ניתן להתחיל. בדקו חיבור וסרקו שוב.", "err");
  }
};

boot();
</script>
</body>
</html>
