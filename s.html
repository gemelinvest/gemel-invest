<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>חתימה על מסמך</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Heebo, Arial, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    min-height: 100dvh;
  }
  .giSignPage { max-width: 920px; margin: 0 auto; padding: 16px 12px 28px; }
  .giSignHello { font-size: clamp(26px, 7vw, 36px); font-weight: 800; margin: 8px 0 4px; }
  .giSignDoc { color: #475569; font-size: 15px; margin-bottom: 6px; }
  .giSignStep { margin: 0 0 14px; color: #3870ed; font-weight: 800; font-size: 18px; }
  .giSignHot.is-missed { border-style: solid; box-shadow: 0 0 0 4px rgba(56,112,237,.28); }
  .giSignStage {
    position: relative;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  .giSignStage canvas { display: block; width: auto; height: auto; }
  .giSignSheet { position: relative; }
  .giSignSheet + .giSignSheet { border-top: 1px solid #e2e8f0; }
  .giSignHot, .giSignMark {
    position: absolute;
    border-radius: 8px;
  }
  .giSignHot {
    border: 2px dashed #3870ed;
    background: rgba(56, 112, 237, .12);
    color: #1e3a8a;
    font-weight: 800;
    font-size: 15px;
    font-family: inherit;
  }
  .giSignMark { object-fit: contain; pointer-events: none; background: transparent; }
  .giSignActions { display: flex; gap: 10px; margin-top: 14px; }
  .giSignBtn {
    appearance: none;
    border: 0;
    border-radius: 12px;
    padding: 14px 18px;
    font: inherit;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
  }
  .giSignBtn--primary { background: #3870ed; color: #fff; }
  .giSignBtn--ghost { background: #e2e8f0; color: #0f172a; }
  .giSignBtn[disabled] { opacity: .6; }
  .giSignCelebrate {
    position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(248,250,252,.94);
  }
  .giSignCelebrate[hidden] { display: none !important; }
  .giSignPapers { position: relative; width: 148px; height: 168px; }
  .giSignPaper {
    position: absolute; left: 28px; top: 18px; width: 92px; height: 120px;
    background: #fff; border: 2px solid #3870ed; border-radius: 8px;
    box-shadow: 0 10px 24px rgba(15,23,42,.12);
    animation: giPaperIn .55s ease both;
  }
  .giSignPaper:nth-child(1) { transform: rotate(-10deg); animation-delay: 0s; }
  .giSignPaper:nth-child(2) { left: 38px; animation-delay: .12s; }
  .giSignPaper:nth-child(3) { transform: rotate(9deg); left: 48px; animation-delay: .24s; }
  .giSignPaper::before, .giSignPaper::after {
    content: ""; position: absolute; right: 12px; left: 12px; height: 6px; border-radius: 99px; background: #dbe6ff;
  }
  .giSignPaper::before { top: 28px; }
  .giSignPaper::after { top: 44px; width: 46px; }
  .giSignTick {
    width: 92px; height: 92px; border-radius: 50%; background: #16a34a;
    display: grid; place-items: center; animation: giTickPop .45s .35s ease both;
  }
  .giSignTick svg { width: 54px; height: 54px; }
  .giSignTick path {
    fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 48; stroke-dashoffset: 48; animation: giTickDraw .55s .55s ease forwards;
  }
  @keyframes giPaperIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes giTickPop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes giTickDraw { to { stroke-dashoffset: 0; } }
  .giSignError { color: #b45309; font-weight: 700; }
  .giSignPad {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 12px;
    z-index: 5;
  }
  .giSignPad[hidden], [hidden] { display: none !important; }
  .giSignPad__card {
    width: min(560px, 100%);
    background: #fff;
    border-radius: 18px;
    padding: 14px;
  }
  .giSignPad__title { font-weight: 800; margin-bottom: 8px; }
  .giSignDraw {
    width: 100%;
    height: auto;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    touch-action: none;
    background: #fff;
  }
  .giSignSuccess {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .giSignSuccess h1 { font-size: clamp(28px, 8vw, 40px); margin: 0 0 8px; }
  .giSignSuccess p { font-size: 18px; color: #334155; margin: 0 0 18px; }
  .giSignGate {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    max-width: 440px;
  }
  .giSignLogo { width: 88px; height: 88px; margin: 0 auto 8px; }
  .giSignLogo svg { display: block; width: 88px; height: 88px; }
  .giSignGate .giSignHello,
  .giSignGate .giSignDoc { width: 100%; text-align: center; }
  .giSignGate form { width: 100%; text-align: start; }
  .giSignField {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px 16px;
    font: inherit;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .12em;
    margin: 8px 0 14px;
    background: #fff;
  }
  .giSignLabel { font-weight: 700; }
</style>
</head>
<body>
<main class="giSignPage" id="giSignLoading"><p>טוען…</p></main>
<main class="giSignPage" id="giSignError" hidden>
  <h1 class="giSignHello">הלינק לא זמין</h1>
  <p id="giSignErrorText">לא הצלחנו לפתוח את המסמך לחתימה.</p>
</main>
<main class="giSignPage giSignGate" id="giSignGate" hidden>
  <div class="giSignLogo" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88">
      <circle cx="44" cy="44" r="42" fill="#eef3ff"/>
      <circle cx="44" cy="44" r="41.2" fill="none" stroke="#3870ED" stroke-opacity=".2" stroke-width="1.2"/>
      <g transform="translate(40 46) rotate(-12)">
        <rect x="-15" y="-24" width="30" height="42" rx="3.2" fill="#d5e2ff"/>
        <path d="M9 -24h6v7h-6z" fill="#b9ccfb"/>
      </g>
      <g transform="translate(43 45)">
        <rect x="-16" y="-23" width="32" height="44" rx="3.4" fill="#fff" stroke="#3870ED" stroke-width="1.6"/>
        <path d="M10 -23h6.2v7.2h-6.2z" fill="#eef3ff" stroke="#3870ED" stroke-width="1.2"/>
        <path d="M-9 -8h16M-9 -1.5h16M-9 5h10" stroke="#3870ED" stroke-width="1.7" stroke-linecap="round"/>
      </g>
      <g transform="translate(58 56) rotate(-36)">
        <rect x="-18" y="-3.1" width="28" height="6.2" rx="2.2" fill="#3870ED"/>
        <rect x="-18" y="-3.1" width="6.5" height="6.2" rx="1.4" fill="#1e4bb8"/>
        <rect x="6.2" y="-3.1" width="2.4" height="6.2" fill="#9eb6f5"/>
        <path d="M8.6 -3.1 L17.4 0 L8.6 3.1 Z" fill="#1e3a8a"/>
      </g>
    </svg>
  </div>
  <h1 class="giSignHello">כניסה לחתימה</h1>
  <p class="giSignDoc">הזן תעודת זהות כדי לפתוח את המסמך</p>
  <form id="giSignGateForm" autocomplete="off">
    <label class="giSignLabel" for="giSignId">תעודת זהות</label>
    <input class="giSignField" id="giSignId" type="password" inputmode="numeric" autocomplete="new-password" maxlength="16" enterkeyhint="go"/>
    <button class="giSignBtn giSignBtn--primary" id="giSignGateGo" type="submit">המשך</button>
    <p class="giSignError" id="giSignGateError" hidden>תעודת הזהות לא תואמת</p>
  </form>
</main>
<main class="giSignPage giSignGate" id="giSignWait" hidden>
  <h1 class="giSignHello">אנא המתן</h1>
  <p class="giSignDoc" id="giSignWaitName"></p>
</main>
<main class="giSignPage" id="giSignApp" hidden>
  <h1 class="giSignHello" id="giSignHello"></h1>
  <div class="giSignDoc" id="giSignDoc"></div>
  <p class="giSignStep" id="giSignStep" hidden></p>
  <div class="giSignStage" id="giSignStage">
    <canvas id="giSignCanvas"></canvas>
    <button class="giSignHot" id="giSignHot" type="button">לחץ לחתימה</button>
    <img class="giSignMark" id="giSignMark" alt="" hidden/>
  </div>
  <p class="giSignError" id="giSignAlready" hidden>המסמך כבר נחתם.</p>
  <div class="giSignActions">
    <button class="giSignBtn giSignBtn--primary" id="giSignSend" type="button" hidden>אשר ושלח</button>
  </div>
  <p class="giSignError" id="giSignSendError" hidden>לא הצלחנו לקלוט את החתימה. נסו שוב.</p>
</main>
<section class="giSignSuccess" id="giSignSuccess" hidden>
  <div>
    <h1>החתימה נקלטה בהצלחה</h1>
    <p>תודה על שיתוף הפעולה</p>
    <button class="giSignBtn giSignBtn--primary" id="giSignDownload" type="button">הורד לטלפון</button>
  </div>
</section>
<div class="giSignCelebrate" id="giSignCelebrate" hidden>
  <div class="giSignPapers" aria-hidden="true">
    <div class="giSignPaper"></div>
    <div class="giSignPaper"></div>
    <div class="giSignPaper"></div>
  </div>
  <div class="giSignTick" aria-hidden="true">
    <svg viewBox="0 0 64 64"><path d="M16 34 L27 45 L48 20"/></svg>
  </div>
</div>
<div class="giSignPad" id="giSignPad" hidden>
  <div class="giSignPad__card">
    <div class="giSignPad__title">חתימה</div>
    <canvas class="giSignDraw" id="giSignDraw"></canvas>
    <div class="giSignActions">
      <button class="giSignBtn giSignBtn--ghost" id="giSignPadCancel" type="button">ביטול</button>
      <button class="giSignBtn giSignBtn--primary" id="giSignPadSave" type="button">שמור</button>
    </div>
  </div>
</div>
<script src="./gi-sign-engine.js?v=20261002-sign-v7"></script>
<script src="./gi-sign-page.js?v=20261002-sign-v7"></script>
</body>
</html>
