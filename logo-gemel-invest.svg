<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1808 373" role="img" aria-label="GEMEL INVEST" class="giBrandLogo">
  <defs>
    <linearGradient id="giLogoGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d08a"/>
      <stop offset="45%" stop-color="#c9a962"/>
      <stop offset="100%" stop-color="#a88642"/>
    </linearGradient>
    <linearGradient id="giLogoShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="42%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,.92)"/>
      <stop offset="58%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="giLogoInvestShineClip">
      <rect x="98" y="78" width="430" height="188" rx="8"/>
    </clipPath>
    <mask id="giLogoRasterMask">
      <rect width="1808" height="373" fill="#fff"/>
      <circle cx="929" cy="107" r="18.5" fill="#000"/>
    </mask>
  </defs>

  <image class="gi-logo-raster" xlink:href="logo-login-clean.png" x="0" y="0" width="1808" height="373" mask="url(#giLogoRasterMask)"/>

  <!-- shine on INVEST (right ? left) -->
  <g class="gi-logo-invest-shine" clip-path="url(#giLogoInvestShineClip)">
    <rect class="gi-logo-invest-shine-bar" x="500" y="82" width="72" height="188" fill="url(#giLogoShine)" opacity="0"/>
  </g>

  <!-- gold circle in ? ? zoom layer -->
  <circle class="gi-logo-gold-circle" cx="929" cy="107" r="16.3" fill="url(#giLogoGold)"/>
</svg>
