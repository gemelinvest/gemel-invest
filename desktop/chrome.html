<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #f8fafc;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
    cursor: default;
  }
  body {
    box-sizing: border-box;
    border-bottom: 1px solid #e5e7eb;
  }
  #giWindowButtons {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 6px;
    direction: ltr;
    -webkit-app-region: no-drag;
  }
  button {
    width: 20px;
    height: 20px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #334155;
    display: grid;
    place-items: center;
    padding: 0;
    cursor: pointer;
  }
  button:hover { background: #e7edf6; }
  button[data-act="close"]:hover { background: #ED1C24; color: #fff; }
</style>
</head>
<body>
<div id="giWindowButtons">
  <button type="button" data-act="minimize" aria-label="מזעור">
    <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 6.5h8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
  <button type="button" data-act="maximize" aria-label="הגדלה">
    <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <button type="button" data-act="close" aria-label="סגירה">
    <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M3 3l6 6M9 3L3 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
</div>
</body>
</html>
