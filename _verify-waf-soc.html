<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>בדיקת הגנת המערכת</title>
<link href="./gi-firewall.css?v=20261009-waf-simple-v1" rel="stylesheet"/>
<style>
  body{margin:0;font-family:Heebo,Rubik,Arial,sans-serif;background:#f1f5f9;color:#0f172a;}
  .wrap{max-width:900px;margin:24px auto;padding:0 16px 40px;}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px 20px;box-shadow:0 8px 30px rgba(15,23,42,.06);}
  .btn{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;}
  .btn--primary{background:#0f172a;color:#fff;border-color:#0f172a;}
  .input,.label,.help,.field{display:block;width:100%;}
  .input{border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;font:inherit;}
  .card__title{font-size:22px;font-weight:800;}
  .card__hint{color:#64748b;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="giWafRoot">
    <div class="card__head giWaf__head">
      <div>
        <div class="giWaf__titleRow">
          <div class="card__title">הגנת המערכת</div>
          <span class="giWafPill" id="giWafPill">הגנה דולקת</span>
        </div>
        <div class="card__hint">שומרת שהמערכת לא תקבל בקשות חשודות.</div>
      </div>
      <label class="giWafSwitch">
        <input id="giWafEnabled" type="checkbox" checked/>
        <span>ההגנה דולקת</span>
      </label>
    </div>
    <div class="card__body giWaf">
      <div class="giWafStatus" id="giWafStatusBox">
        <b id="giWafStatusTitle">הכל תקין</b>
        <span id="giWafStatusText">אין משהו שדורש מכם טיפול.</span>
      </div>
      <div class="giWaf__kpis" hidden>
        <div class="giWafKpi"><b id="giWafKpiBlocked">0</b><span>חסימות</span></div>
        <div class="giWafKpi"><b id="giWafKpiAlerts">0</b><span>התראות</span></div>
        <div class="giWafKpi"><b id="giWafKpiIncidents">0</b><span>פתוחים</span></div>
        <div class="giWafKpi"><b id="giWafKpiRules">0</b><span>כללים</span></div>
      </div>
      <div class="giWaf__tabs">
        <button class="btn is-active" type="button" data-waf-tab="incidents">מה קרה</button>
        <button class="btn" type="button" data-waf-tab="settings">הגדרות</button>
      </div>
      <div data-waf-pane="incidents">
        <div class="giWafProbe">
          <button class="btn" type="button" data-waf-close-probes id="giWafCloseProbes">סגור את כל הבדיקות</button>
          <button class="btn" type="button" data-waf-probe id="giWafProbeBtn">לבדוק שההגנה עובדת</button>
          <span class="giWafProbeOut" id="giWafProbeOut">הבדיקה נשארת אצלכם במחשב.</span>
        </div>
        <div id="giWafIncidentBody"></div>
      </div>
      <div data-waf-pane="settings" hidden>
        <div id="giWafRulesBody"></div>
        <div class="giWafForm">
          <div class="field">
            <label class="label" for="giWafIpInput">לחסום כתובת מחשב (IP)</label>
            <input class="input" id="giWafIpInput" dir="ltr"/>
          </div>
          <div class="field">
            <label class="label" for="giWafIpNote">למה חוסמים</label>
            <input class="input" id="giWafIpNote"/>
          </div>
          <button class="btn btn--primary" type="button" data-waf-addip>חסום</button>
        </div>
        <div class="help" id="giWafIpMsg"></div>
        <table class="giWafTable"><tbody id="giWafBlockBody"></tbody></table>
      </div>
      <div id="giWafLiveBody" hidden></div>
    </div>
  </div>
</div>
<script src="./gi-waf-engine.js?v=20261009-waf-simple-v1"></script>
<script>window.GiWaf.renderConsole();</script>
</body>
</html>
