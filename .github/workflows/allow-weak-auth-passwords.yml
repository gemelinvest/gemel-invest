# Applies hosted Auth settings so Studio accepts leaked/weak passwords.
# Uses the existing SUPABASE_ACCESS_TOKEN Actions secret.
name: Allow weak Auth passwords

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/allow-weak-auth-passwords.yml"
      - "scripts/disable-auth-hibp.sh"

jobs:
  disable-hibp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable leaked-password protection
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: vhvlkerectggovfihjgm
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. Add the Actions secret, or turn off Authentication → Providers → Email → Leaked password protection in Studio."
            exit 1
          fi
          chmod +x scripts/disable-auth-hibp.sh
          ./scripts/disable-auth-hibp.sh
