# Deploy gi-provision-agent-auth when its source changes.
# Syncs a typed CRM PIN onto agents.pin and an existing Auth password.
# verify_jwt stays false — the function checks admin/manager identity itself.

name: Deploy provision-agent-auth

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/gi-provision-agent-auth/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-provision-agent-auth.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gi-provision-agent-auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy gi-provision-agent-auth --project-ref vhvlkerectggovfihjgm --no-verify-jwt
