# Applies the personal-area gate after it changes on main.
# A feature branch does not update the live database.

name: Apply personal area open

on:
  push:
    branches: [main]
    paths:
      - "supabase-onyx-customer-portal.sql"
      - "scripts/apply-portal-open.mjs"
      - ".github/workflows/apply-portal-open.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the personal area gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. The personal area stays on the previous gate."
            exit 1
          fi
          node scripts/apply-portal-open.mjs
