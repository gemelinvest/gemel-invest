# Deploy gi-open-agent-session when its source changes.
# Issues the Auth JWT after a verified PIN. verify_jwt stays false —
# the function checks the PIN itself via gi_verify_agent_login.

name: Deploy open-agent-session

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/gi-open-agent-session/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-open-agent-session.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gi-open-agent-session
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy gi-open-agent-session --project-ref vhvlkerectggovfihjgm --no-verify-jwt
