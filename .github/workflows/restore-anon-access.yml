# Restore anon access on the tables closed by the RLS cutover.
# Runs when this workflow or the restore SQL changes on main.

name: Restore anon access

on:
  push:
    branches: [main]
    paths:
      - "supabase-gi-restore-anon-access.sql"
      - "scripts/restore-anon-access.mjs"
      - ".github/workflows/restore-anon-access.yml"
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore anon table access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. Add the Actions secret."
            exit 1
          fi
          node scripts/restore-anon-access.mjs
