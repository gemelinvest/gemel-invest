# Deploys the agent login code. A push to a feature branch does not
# update the live function. Mail is sent by the Outlook account already
# connected for the daily sales report.

name: Deploy login mail code

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/gi-login-mail-code/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-login-mail-code.yml"
  workflow_dispatch:

concurrency:
  group: gi-login-mail-code-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gi-login-mail-code
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. The login code stays on the previous function."
            exit 1
          fi
          supabase functions deploy gi-login-mail-code --project-ref vhvlkerectggovfihjgm --no-verify-jwt
