# Applies the operations mirror-call customer access after it reaches main.
# A feature branch does not update the live database.

name: Apply ops mirror customer access

on:
  push:
    branches: [main]
    paths:
      - "supabase-gi-ops-mirror-customer-access.sql"
      - "scripts/apply-ops-mirror-customer-access.mjs"
      - ".github/workflows/apply-ops-mirror-customer-access.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply operations mirror customer access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. The mirror search stays on the previous row policy."
            exit 1
          fi
          node scripts/apply-ops-mirror-customer-access.mjs
