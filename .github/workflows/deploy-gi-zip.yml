# Deploys the postal-code lookup. A push to a feature branch does not
# update the live function.

name: Deploy gi-zip

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/gi-zip/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-gi-zip.yml"
  workflow_dispatch:

concurrency:
  group: gi-zip-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gi-zip
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. The postal lookup stays on the previous function."
            exit 1
          fi
          supabase functions deploy gi-zip --project-ref vhvlkerectggovfihjgm --no-verify-jwt --yes
