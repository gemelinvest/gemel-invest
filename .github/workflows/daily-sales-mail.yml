# Daily-sales Outlook send at 12:30 / 15:00 / 20:00 Asia/Jerusalem.
# Hosted Supabase Edge Functions do not support Deno.cron; this workflow is
# the clock. It POSTs { action: "send-slot", slot } to gi-daily-sales-mail.
#
# GitHub cron is UTC-only and often hours late. A 35-minute Israel-time gate
# dropped 12:30 entirely. A wide window without live-function dedup then
# sent the 15:00 report four times the same afternoon.
#
# Clock:
#   1) poll every 10 minutes
#   2) extra crons inside the 12:30 Israel window (GitHub skipped 09:30 UTC
#      for a week)
#   3) send the current Israel slot (12:30 until 15:00, 15:00 until 20:00,
#      20:00 until midnight)
# The live Edge Function must send that snapshot ONCE per slot per day.
# A 90-minute window is not used: it expired while GitHub was still in the
# same slot and sent again.
#
# On push to main this workflow also deploys gi-daily-sales-mail. Changing
# only the git file does not update the function that Outlook actually hits.

name: Daily sales mail slots

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/gi-daily-sales-mail/**"
      - "supabase/config.toml"
      - ".github/workflows/daily-sales-mail.yml"
  schedule:
    - cron: "*/10 * * * *"
    # 12:30 IDT window (UTC+3): 09:30–11:50
    - cron: "30 9 * * *"
    - cron: "40 9 * * *"
    - cron: "50 9 * * *"
    - cron: "10 10 * * *"
    - cron: "20 10 * * *"
    - cron: "40 10 * * *"
    - cron: "50 10 * * *"
    - cron: "10 11 * * *"
    - cron: "20 11 * * *"
    - cron: "40 11 * * *"
    - cron: "50 11 * * *"
    # 15:00 / 20:00 IDT
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    # 12:30 / 15:00 / 20:00 IST (UTC+2)
    - cron: "30 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: gi-daily-sales-mail-${{ github.event_name == 'push' && 'deploy' || 'slot' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' && secrets.SUPABASE_ACCESS_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gi-daily-sales-mail
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy gi-daily-sales-mail --project-ref vhvlkerectggovfihjgm --no-verify-jwt

  send-slot:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fire send-slot at Israel 12:30 / 15:00 / 20:00
        env:
          MAIL_FN_URL: https://vhvlkerectggovfihjgm.supabase.co/functions/v1/gi-daily-sales-mail
          MAIL_FN_KEY: sb_publishable_JixJJelGPWcP0BPKGq96Lw_nIiMyIBb
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, os, sys, urllib.error, urllib.request

          SLOTS = (
              ("12:30", 12 * 60 + 30, 15 * 60),
              ("15:00", 15 * 60, 20 * 60),
              ("20:00", 20 * 60, 24 * 60),
          )

          def due_slot(minutes):
              for name, start, end in SLOTS:
                  if start <= minutes < end:
                      return name
              return None

          event = os.environ.get("GITHUB_EVENT_NAME") or ""
          now = datetime.now(ZoneInfo("Asia/Jerusalem"))
          minutes = now.hour * 60 + now.minute
          slot = due_slot(minutes)
          if event != "workflow_dispatch" and not slot:
              print("skip: Israel {0} is before 12:30".format(now.strftime("%Y-%m-%d %H:%M %Z")))
              sys.exit(0)
          if not slot:
              slot = "manual"

          url = os.environ["MAIL_FN_URL"]
          key = os.environ["MAIL_FN_KEY"]
          body = json.dumps({
              "action": "send-slot",
              "scheduled": True,
              "slot": slot,
          }).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "apikey": key,
                  "Authorization": "Bearer " + key,
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=90) as res:
                  raw = res.read().decode("utf-8", "replace")
                  print("status", res.status)
                  print(raw)
                  data = json.loads(raw) if raw else {}
          except urllib.error.HTTPError as err:
              raw = err.read().decode("utf-8", "replace")
              print("status", err.code)
              print(raw)
              sys.exit(1)

          if data.get("ok") is False:
              print("send-slot failed:", data.get("error"))
              sys.exit(1)
          if data.get("skipped"):
              reason = data.get("error") or ""
              print("send-slot skipped:", reason)
              # Once-per-Israel-slot dedup is expected on extra cron fires.
              if "כבר נשלח" in reason:
                  sys.exit(0)
              print("send-slot missed a due Israel slot")
              sys.exit(1)
          print("send-slot ok:", data.get("message") or "sent", "slot", slot)
          PY
