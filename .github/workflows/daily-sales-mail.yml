# Daily-sales Outlook send at 12:30 / 15:00 / 20:00 Asia/Jerusalem.
# Hosted Supabase Edge Functions do not support Deno.cron; this workflow is
# the clock. It POSTs { action: "send-slot", slot } to gi-daily-sales-mail.
#
# GitHub cron can be late, so we keep a 10-minute Israel poll plus three
# exact slot times. The live Edge Function sends ONCE per Israel slot per day.
#
# Do not put secrets.* in a job-level `if` — GitHub evaluates that as empty,
# skips every job, and treats `jobs: []` as a failure. Repeated schedule
# failures disable the workflow (this clock was dead after 6 Sep 2026).
# Do not fail the job on expected skips (אין דוח שמור / כבר נשלח).
#
# On push to main this workflow deploys gi-daily-sales-mail. Changing only
# the git file does not update the function that Outlook actually hits.
#
# Clock: 10-minute Israel poll + exact slot times. Edge Function sends once
# per Israel slot per day (SCHEDULED_SEND_DISABLED must stay false).

name: Daily sales mail slots

on:
  schedule:
    - cron: "*/10 * * * *"
      timezone: "Asia/Jerusalem"
    - cron: "30 12 * * *"
      timezone: "Asia/Jerusalem"
    - cron: "0 15 * * *"
      timezone: "Asia/Jerusalem"
    - cron: "0 20 * * *"
      timezone: "Asia/Jerusalem"
  push:
    branches: [main]
    paths:
      - "supabase/functions/gi-daily-sales-mail/**"
      - "supabase/config.toml"
      - ".github/workflows/daily-sales-mail.yml"
  workflow_dispatch:

concurrency:
  group: gi-daily-sales-mail-${{ github.event_name == 'push' && 'deploy' || 'slot' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gi-daily-sales-mail
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. Add the Actions secret so Outlook hits the git function."
            exit 1
          fi
          supabase functions deploy gi-daily-sales-mail --project-ref vhvlkerectggovfihjgm --no-verify-jwt

  send-slot:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fire send-slot (Edge decides Israel slots from prefs)
        env:
          MAIL_FN_URL: https://vhvlkerectggovfihjgm.supabase.co/functions/v1/gi-daily-sales-mail
          MAIL_FN_KEY: sb_publishable_JixJJelGPWcP0BPKGq96Lw_nIiMyIBb
          MAIL_CRON_SECRET: ${{ secrets.GI_DAILY_SALES_MAIL_CRON_SECRET }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, os, sys, urllib.error, urllib.request

          event = os.environ.get("GITHUB_EVENT_NAME") or ""
          now = datetime.now(ZoneInfo("Asia/Jerusalem"))
          minutes = now.hour * 60 + now.minute
          # Quiet overnight; Edge still owns exact slot prefs.
          if event != "workflow_dispatch" and minutes < 6 * 60:
              print("skip: Israel {0} is before 06:00".format(now.strftime("%Y-%m-%d %H:%M %Z")))
              sys.exit(0)

          url = os.environ["MAIL_FN_URL"]
          key = os.environ["MAIL_FN_KEY"]
          cron_secret = os.environ.get("MAIL_CRON_SECRET") or ""
          if not cron_secret:
              print("skip: GI_DAILY_SALES_MAIL_CRON_SECRET missing")
              sys.exit(0)
          body = json.dumps({
              "action": "send-slot",
              "scheduled": True,
              "slot": "auto",
          }).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "apikey": key,
                  "Authorization": "Bearer " + key,
                  "x-gi-mail-cron-secret": cron_secret,
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=90) as res:
                  raw = res.read().decode("utf-8", "replace")
                  print("status", res.status)
                  print(raw)
                  data = json.loads(raw) if raw else {}
          except urllib.error.HTTPError as err:
              raw = err.read().decode("utf-8", "replace")
              print("status", err.code)
              print(raw)
              sys.exit(1)

          if data.get("ok") is False:
              print("send-slot failed:", data.get("error"))
              sys.exit(1)
          if data.get("skipped"):
              reason = data.get("error") or ""
              print("send-slot skipped:", reason)
              # Expected skips must not fail the workflow. Consecutive failures
              # disable GitHub's schedule and the clock stays dead.
              sys.exit(0)
          print("send-slot ok:", data.get("message") or "sent", "slot", data.get("slot") or "auto")
          PY
