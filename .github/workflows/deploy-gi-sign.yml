# Publish the cancel-form signature server.
# A push to main that touches this workflow, the function, or the SQL
# creates the tables and deploys gi-sign. The CRM cannot create a link
# until this has run.

name: Deploy gi-sign

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/gi-sign/**"
      - "supabase-gi-sign.sql"
      - "scripts/deploy-gi-sign.mjs"
      - "supabase/config.toml"
      - ".github/workflows/deploy-gi-sign.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create tables and deploy gi-sign
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. Add the Actions secret."
            exit 1
          fi
          node scripts/deploy-gi-sign.mjs
