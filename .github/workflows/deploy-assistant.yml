name: Deploy assistant Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/gi-assistant-*/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-assistant.yml"

jobs:
  deploy:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy assistant functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy gi-assistant-pairing --project-ref vhvlkerectggovfihjgm --no-verify-jwt
          supabase functions deploy gi-assistant-realtime --project-ref vhvlkerectggovfihjgm --no-verify-jwt
          supabase functions deploy gi-assistant-engine --project-ref vhvlkerectggovfihjgm --no-verify-jwt
          supabase functions deploy gi-assistant-tools --project-ref vhvlkerectggovfihjgm --no-verify-jwt
