# Deploys the collection mailbox reader. A push to a feature branch does
# not update the live function. The function reads gviyaas@i-s-f.co.il
# after a one-time Outlook consent. It does not use the sales mailbox token.

name: Deploy collection mail

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/gi-collection-mail/**"
      - "gi-collection.js"
      - "supabase/config.toml"
      - ".github/workflows/deploy-collection-mail.yml"
  workflow_dispatch:

concurrency:
  group: gi-collection-mail-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy gi-collection-mail
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. The collection reader stays on the previous function."
            exit 1
          fi
          supabase functions deploy gi-collection-mail --project-ref vhvlkerectggovfihjgm --no-verify-jwt
