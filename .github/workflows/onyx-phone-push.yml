# Lock-screen alerts for the ONYX phone.
# Hosted Edge Functions have no Deno.cron, so this workflow is the clock.
# It also deploys onyx-phone-push when this file or the function changes on main.
# Apply supabase-onyx-phone-push.sql once in the SQL editor. Until that
# table exists, dispatch returns missing-table and this job stays green.

name: ONYX phone push

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "supabase/functions/onyx-phone-push/**"
      - "supabase/config.toml"
      - ".github/workflows/onyx-phone-push.yml"
  workflow_dispatch:

concurrency:
  group: onyx-phone-push-${{ github.event_name == 'push' && 'deploy' || 'tick' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy onyx-phone-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty. Add the Actions secret so the phone function is deployed."
            exit 1
          fi
          supabase functions deploy onyx-phone-push --project-ref vhvlkerectggovfihjgm --no-verify-jwt

  dispatch:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders and sales
        env:
          PUSH_URL: https://vhvlkerectggovfihjgm.supabase.co/functions/v1/onyx-phone-push
          PUSH_KEY: sb_publishable_JixJJelGPWcP0BPKGq96Lw_nIiMyIBb
          PUSH_SECRET: ${{ secrets.ONYX_PUSH_CRON_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          headers = {
            "Content-Type": "application/json",
            "apikey": os.environ["PUSH_KEY"],
            "Authorization": "Bearer " + os.environ["PUSH_KEY"],
            "x-onyx-push": os.environ.get("PUSH_SECRET") or "dispatch",
          }
          req = urllib.request.Request(
            os.environ["PUSH_URL"],
            data=json.dumps({"action": "dispatch"}).encode(),
            headers=headers,
            method="POST",
          )
          try:
            with urllib.request.urlopen(req, timeout=60) as res:
              body = res.read().decode()
              print(body)
          except urllib.error.HTTPError as err:
            body = err.read().decode()
            print(body)
            if err.code == 503 and "missing-table" in body:
              print("Apply supabase-onyx-phone-push.sql once in the SQL editor.")
              raise SystemExit(0)
            if err.code == 404:
              print("onyx-phone-push is not deployed yet.")
              raise SystemExit(0)
            raise SystemExit(1)
          PY
