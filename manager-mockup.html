<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ONYX CRM · מוקאפ פאנל מנהלים</title>
<link rel="stylesheet" href="manager-panel.css"/>
</head>
<body>
<main class="page">
  <h1>ONYX CRM · פאנל מנהלים</h1>
  <p class="lede">מוקאפ אחד-לאחד. אייפון 390×844, גלקסי 360×800. אותם מסכים שיהיו בדמו.</p>

  <section class="group" id="iphone-row">
    <h2>IPHONE</h2>
    <div class="row">

      <figure class="shot" id="iphone-login" data-screen="login">
        <div class="device device--iphone"><div class="device__screen">
          <section class="screen screen--login">
            <div class="status"><span class="status__time">9:41</span><i class="island"></i><i class="hole"></i><span class="status__icons" data-icons></span></div>
            <div class="login">
              <img class="login__logo" src="assets/onyx-crm-logo.png" alt="ONYX CRM"/>
              <div class="login__kicker">כניסת מנהלים</div>
              <label class="field"><span>שם משתמש</span><div class="box">manager</div></label>
              <label class="field"><span>סיסמה</span><div class="box box--pass">••••••••</div></label>
              <div class="btn">כניסה</div>
              <p class="login__hint">הדגמה · manager / demo1234<br/>אחר כך קוד אימות 482913</p>
            </div>
            <div class="homebar"><i></i></div>
          </section>
        </div></div>
        <figcaption>כניסה</figcaption>
      </figure>

      <figure class="shot" id="iphone-mfa" data-screen="mfa">
        <div class="device device--iphone"><div class="device__screen">
          <section class="screen screen--mfa">
            <div class="status"><span class="status__time">9:41</span><i class="island"></i><i class="hole"></i><span class="status__icons" data-icons></span></div>
            <div class="mfa">
              <img class="mfa__logo" src="assets/onyx-crm-logo.png" alt="ONYX CRM"/>
              <h2>אימות דו-שלבי</h2>
              <p>הזינו את הקוד בן 6 הספרות<br/>מאפליקציית האימות</p>
              <div class="otp" dir="ltr"><b>4</b><b>8</b><b>2</b><b>9</b><b>1</b><b>3</b></div>
              <div class="btn">אישור</div>
              <div class="mfa__back">חזרה לכניסה</div>
            </div>
            <div class="homebar"><i></i></div>
          </section>
        </div></div>
        <figcaption>אימות דו-שלבי</figcaption>
      </figure>

      <figure class="shot" id="iphone-home" data-screen="home">
        <div class="device device--iphone"><div class="device__screen">
          <section class="screen screen--app">
            <div class="status"><span class="status__time">9:41</span><i class="island"></i><i class="hole"></i><span class="status__icons" data-icons></span></div>
            <header class="appbar">
              <img class="appbar__mark" src="assets/onyx-mark.png" alt=""/>
              <div class="appbar__brand"><strong>ONYX</strong><span>פאנל מנהלים</span></div>
              <div class="appbar__user"><b>דנה כהן</b><span>מנהלת</span></div>
            </header>
            <div class="stage">
              <div class="hello">
                <div><b>בוקר טוב, דנה</b><span>יום רביעי, 7 באוקטובר</span></div>
                <em>עודכן 09:41</em>
              </div>
              <article class="hero">
                <div class="hero__k">נמכר היום</div>
                <div class="hero__v" dir="ltr">₪48,750</div>
                <div class="hero__s">14 פוליסות · 9 לקוחות · כל הסוכנות</div>
              </article>
              <article class="card leads">
                <div class="leads__top">
                  <div><span class="k">לידים שנסגרו היום</span><strong dir="ltr">6</strong></div>
                  <span class="pill">הצג הכל</span>
                </div>
                <div class="mini"><div><b>יוסי אברהם</b><span>מור לוי · בריאות</span></div><span class="amt" dir="ltr">₪1,240</span></div>
                <div class="mini"><div><b>רינת דהן</b><span>דנה כהן · ביטוח פרט</span></div><span class="amt" dir="ltr">₪860</span></div>
              </article>
              <div class="metrics">
                <article class="card metric"><span>פרמיה חודשית נטו</span><b dir="ltr">₪612,400</b><small class="up" dir="ltr">▲ 8.4%</small></article>
                <article class="card metric"><span>פרמיה מהפקה</span><b dir="ltr">₪186,200</b><small class="mute">42 פוליסות</small></article>
                <article class="card metric"><span>פרמיה בביטול</span><b dir="ltr">₪24,800</b><small class="down">6 פוליסות</small></article>
                <article class="card metric"><span>עמידה ביעד</span><b dir="ltr">73%</b><small class="mute" dir="ltr">יעד ₪840,000</small></article>
              </div>
              <article class="card split">
                <div><span>מכירות מודיעין</span><b dir="ltr">₪312,600</b></div>
                <div><span>מכירות חיפה</span><b dir="ltr">₪299,800</b></div>
              </article>
            </div>
            <nav class="nav" data-tab="home"></nav>
            <div class="homebar"><i></i></div>
          </section>
        </div></div>
        <figcaption>סקירת מכירות</figcaption>
      </figure>

      <figure class="shot" id="iphone-leads" data-screen="leads">
        <div class="device device--iphone"><div class="device__screen">
          <section class="screen screen--app">
            <div class="status"><span class="status__time">9:41</span><i class="island"></i><i class="hole"></i><span class="status__icons" data-icons></span></div>
            <header class="appbar">
              <img class="appbar__mark" src="assets/onyx-mark.png" alt=""/>
              <div class="appbar__brand"><strong>ONYX</strong><span>פאנל מנהלים</span></div>
              <div class="appbar__user"><b>דנה כהן</b><span>מנהלת</span></div>
            </header>
            <div class="stage">
              <div class="sheet-head"><h2>לידים שנסגרו</h2><span>היום</span></div>
              <article class="card sumline"><span>6 לידים · 4 נציגים</span><b dir="ltr">₪8,290</b></article>
              <article class="card lead"><div class="avatar">י</div><div class="lead__mid"><b>יוסי אברהם</b><span>מור לוי <i class="tag">בריאות</i></span></div><div class="lead__amt" dir="ltr">₪1,240</div></article>
              <article class="card lead"><div class="avatar">ר</div><div class="lead__mid"><b>רינת דהן</b><span>דנה כהן <i class="tag">פרט</i></span></div><div class="lead__amt" dir="ltr">₪860</div></article>
              <article class="card lead"><div class="avatar">א</div><div class="lead__mid"><b>אבי חדד</b><span>אורי ביטון <i class="tag">משכנתא</i></span></div><div class="lead__amt" dir="ltr">₪2,150</div></article>
              <article class="card lead"><div class="avatar">מ</div><div class="lead__mid"><b>מיכל ברק</b><span>נועה פרץ <i class="tag">בריאות</i></span></div><div class="lead__amt" dir="ltr">₪1,480</div></article>
              <article class="card lead"><div class="avatar">ע</div><div class="lead__mid"><b>עומר שמש</b><span>מור לוי <i class="tag">פרט</i></span></div><div class="lead__amt" dir="ltr">₪640</div></article>
              <article class="card lead"><div class="avatar">ה</div><div class="lead__mid"><b>הילה נחום</b><span>דנה כהן <i class="tag">פנסיה</i></span></div><div class="lead__amt" dir="ltr">₪1,920</div></article>
            </div>
            <nav class="nav" data-tab="leads"></nav>
            <div class="homebar"><i></i></div>
          </section>
        </div></div>
        <figcaption>לידים שנסגרו היום</figcaption>
      </figure>

      <figure class="shot" id="iphone-sales" data-screen="sales">
        <div class="device device--iphone"><div class="device__screen">
          <section class="screen screen--app">
            <div class="status"><span class="status__time">9:41</span><i class="island"></i><i class="hole"></i><span class="status__icons" data-icons></span></div>
            <header class="appbar">
              <img class="appbar__mark" src="assets/onyx-mark.png" alt=""/>
              <div class="appbar__brand"><strong>ONYX</strong><span>פאנל מנהלים</span></div>
              <div class="appbar__user"><b>דנה כהן</b><span>מנהלת</span></div>
            </header>
            <div class="stage">
              <div class="sheet-head"><h2>פירוט מכירות</h2><span>היום · ₪48,750</span></div>
              <article class="card agent"><div class="agent__top"><b>מור לוי</b><span dir="ltr">₪14,200</span></div><div class="chips"><i>בריאות 6,400</i><i>פרט 3,200</i><i>אלמנטרי 1,800</i><i>פנסיה 2,800</i></div></article>
              <article class="card agent"><div class="agent__top"><b>דנה כהן</b><span dir="ltr">₪12,450</span></div><div class="chips"><i>בריאות 4,100</i><i>פרט 5,200</i><i>אלמנטרי 1,150</i><i>פנסיה 2,000</i></div></article>
              <article class="card agent"><div class="agent__top"><b>אורי ביטון</b><span dir="ltr">₪11,080</span></div><div class="chips"><i>בריאות 3,800</i><i>פרט 2,400</i><i>אלמנטרי 3,200</i><i>פנסיה 1,680</i></div></article>
              <article class="card agent"><div class="agent__top"><b>נועה פרץ</b><span dir="ltr">₪11,020</span></div><div class="chips"><i>בריאות 4,600</i><i>פרט 2,900</i><i>אלמנטרי 1,400</i><i>פנסיה 2,120</i></div></article>
              <article class="card co">
                <div class="co__row"><span>הראל</span><div class="bar"><i style="width:100%"></i></div><b dir="ltr">₪14,200</b></div>
                <div class="co__row"><span>מגדל</span><div class="bar"><i style="width:81%"></i></div><b dir="ltr">₪11,450</b></div>
                <div class="co__row"><span>כלל</span><div class="bar"><i style="width:68%"></i></div><b dir="ltr">₪9,600</b></div>
                <div class="co__row"><span>הפניקס</span><div class="bar"><i style="width:55%"></i></div><b dir="ltr">₪7,800</b></div>
                <div class="co__row"><span>מנורה</span><div class="bar"><i style="width:40%"></i></div><b dir="ltr">₪5,700</b></div>
              </article>
            </div>
            <nav class="nav" data-tab="sales"></nav>
            <div class="homebar"><i></i></div>
          </section>
        </div></div>
        <figcaption>פירוט מכירות</figcaption>
      </figure>

    </div>
  </section>

  <section class="group" id="galaxy-row">
    <h2>GALAXY</h2>
    <div class="row"></div>
  </section>
</main>
<script>
const ICONS = '<svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="4.5" y="5" width="3" height="7" rx="0.6"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.6"/><rect x="13.5" y="0" width="3" height="12" rx="0.6"/></svg><svg width="15" height="12" viewBox="0 0 15 12" fill="none" aria-hidden="true"><path d="M1 4.2C3.6 1.8 11.4 1.8 14 4.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M3.2 6.6c1.8-1.5 6.8-1.5 8.6 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M5.6 9c.8-.7 3-.7 3.8 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x="0.6" y="0.6" width="20" height="10.8" rx="2.4" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="2" y="2" width="15" height="8" rx="1.2" fill="currentColor"/><rect x="21.6" y="3.6" width="1.8" height="4.8" rx="0.6" fill="currentColor"/></svg>';
const NAV = {
  home: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 9.2 10 3l7 6.2V17a1 1 0 0 1-1 1h-4.2v-4.6H8.2V18H4a1 1 0 0 1-1-1V9.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>סקירה</span>',
  leads: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M4.2 16.2c1.2-2.4 3.2-3.5 5.8-3.5s4.6 1.1 5.8 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>לידים</span>',
  sales: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 15.5 7.2 10l3 2.6L16.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.2 5H16.5V9.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>מכירות</span>'
};
document.querySelectorAll("[data-icons]").forEach((el) => { el.innerHTML = ICONS; });
document.querySelectorAll(".nav").forEach((nav) => {
  const on = nav.getAttribute("data-tab");
  nav.innerHTML = ["home", "leads", "sales"].map((key) =>
    `<div class="${key === on ? "on" : ""}">${NAV[key]}</div>`
  ).join("");
});
const grow = document.querySelector("#galaxy-row .row");
document.querySelectorAll("#iphone-row .shot").forEach((shot) => {
  const clone = shot.cloneNode(true);
  clone.id = "galaxy-" + shot.dataset.screen;
  const device = clone.querySelector(".device");
  device.classList.remove("device--iphone");
  device.classList.add("device--galaxy");
  clone.querySelector(".screen").classList.add("is-galaxy");
  grow.appendChild(clone);
});
const only = new URLSearchParams(location.search).get("only");
if (only) {
  document.body.classList.add("is-shot");
  document.querySelectorAll(".shot").forEach((el) => { if (el.id !== only) el.remove(); });
}
</script>
</body>
</html>
