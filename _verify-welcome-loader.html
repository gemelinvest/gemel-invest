<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>אימות — מסך טעינה אחרי כניסה</title>
<link rel="stylesheet" href="./app.css"/>
<link rel="stylesheet" href="./theme.css"/>
<style>
  body{ margin:0; min-height:100vh; background:#fff; }
  .lcWelcomeLoader{ display:block !important; }
</style>
</head>
<body>
<div id="lcWelcomeLoader" class="lcWelcomeLoader is-open" aria-hidden="false">
  <div class="lcWelcomeLoader__backdrop"></div>
  <div class="lcWelcomeLoader__panel" role="status" aria-live="polite" aria-atomic="true">
    <div class="lcWelcomeLoader__content">
      <div class="onyxSplash" aria-hidden="true">
        <div class="onyxSplash__glow"></div>
        <div class="onyxSplash__mark">
          <img class="onyxSplash__markImg" src="./assets/onyx-splash/mark.png" alt="" draggable="false" />
          <span class="onyxSplash__sheen"></span>
        </div>
        <div class="onyxSplash__word" dir="ltr">
          <span class="onyxSplash__cell onyxSplash__cell--o"><img src="./assets/onyx-splash/o.png" alt="" draggable="false" /></span>
          <span class="onyxSplash__cell onyxSplash__cell--n"><img src="./assets/onyx-splash/n.png" alt="" draggable="false" /></span>
          <span class="onyxSplash__cell onyxSplash__cell--y"><img src="./assets/onyx-splash/y.png" alt="" draggable="false" /></span>
          <span class="onyxSplash__cell onyxSplash__cell--x"><img src="./assets/onyx-splash/x.png" alt="" draggable="false" /><span class="onyxSplash__facet"></span></span>
        </div>
        <div class="onyxSplash__crm" dir="ltr">
          <span class="onyxSplash__rule onyxSplash__rule--l"></span>
          <span class="onyxSplash__crmLetters">
            <span class="onyxSplash__cell onyxSplash__cell--c"><img src="./assets/onyx-splash/c.png" alt="" draggable="false" /></span>
            <span class="onyxSplash__cell onyxSplash__cell--r"><img src="./assets/onyx-splash/r.png" alt="" draggable="false" /></span>
            <span class="onyxSplash__cell onyxSplash__cell--m"><img src="./assets/onyx-splash/m.png" alt="" draggable="false" /></span>
          </span>
          <span class="onyxSplash__rule onyxSplash__rule--r"></span>
        </div>
      </div>
      <span class="onyxSplash__sr" id="lcWelcomeStatus">ONYX CRM</span>
    </div>
  </div>
</div>
</body>
</html>
