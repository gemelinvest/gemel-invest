<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>אימות — מסך טעינה אחרי כניסה</title>
<link rel="stylesheet" href="./app.css"/>
<link rel="stylesheet" href="./theme.css"/>
<style>
  body{ margin:0; min-height:100vh; background:#fff; }
  .lcWelcomeLoader{ display:block !important; }
</style>
</head>
<body>
<div id="lcWelcomeLoader" class="lcWelcomeLoader is-open" aria-hidden="false">
  <div class="lcWelcomeLoader__backdrop"></div>
  <div class="lcWelcomeLoader__panel" role="status" aria-live="polite" aria-atomic="true">
    <div class="lcWelcomeLoader__content">
      <div class="lcWelcomeLoader__mark" aria-hidden="true">
        <div class="lcWelcomeLoader__logoPlate">
          <img class="lcWelcomeLoader__logo" src="./logo-login-clean.png" alt="GEMEL INVEST" />
        </div>
      </div>
      <div class="lcWelcomeLoader__greeting" id="lcWelcomeGreeting">ערב טוב</div>
      <div class="lcWelcomeLoader__name" id="lcWelcomeName">נועה לוי</div>
      <div class="lcWelcomeLoader__sub" id="lcWelcomeStatus">טוען מערכת, אנא המתן</div>
    </div>
  </div>
</div>
</body>
</html>
