<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>גילוי נאות</title>
  <meta property="og:title" content="גילוי נאות" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="he_IL" />
  <meta property="og:image" content="https://gemelinvest.github.io/gemel-invest/disclosure-og.jpg" />
  <meta property="og:image:secure_url" content="https://gemelinvest.github.io/gemel-invest/disclosure-og.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="גילוי נאות" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="גילוי נאות" />
  <meta name="twitter:image" content="https://gemelinvest.github.io/gemel-invest/disclosure-og.jpg" />
  <link rel="image_src" href="https://gemelinvest.github.io/gemel-invest/disclosure-og.jpg" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #eef3fb;
      color: #102047;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 16px 64px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .lead {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.5;
    }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .doc {
      background: #fff;
      border: 1px solid rgba(16, 32, 71, .12);
      border-radius: 16px;
      overflow: hidden;
    }
    .doc h2 {
      margin: 0;
      padding: 14px 16px 12px;
      font-size: 18px;
      line-height: 1.4;
    }
    .pages {
      direction: ltr;
    }
    .pages canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
    .pages canvas + canvas {
      border-top: 1px solid rgba(16, 32, 71, .08);
    }
    .wait, .note, .err {
      margin: 0;
      padding: 12px 16px 16px;
      color: #4b5d86;
    }
    .err { color: #8a3b12; }
  </style>
</head>
<body>
  <main>
    <h1>גילוי נאות</h1>
    <p class="lead" id="lead">המסמכים שנבחרו לפי הפוליסות המוצעות.</p>
    <div class="stack" id="list"></div>
    <p class="err" id="err" hidden></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script>
    (function(){
      var URL = "https://vhvlkerectggovfihjgm.supabase.co";
      var KEY = "sb_publishable_JixJJelGPWcP0BPKGq96Lw_nIiMyIBb";
      var list = document.getElementById("list");
      var err = document.getElementById("err");
      var lead = document.getElementById("lead");
      var params = new URLSearchParams(location.search);
      var token = (params.get("t") || "").trim();
      var docs = [];
      var renderGen = 0;
      if(window.pdfjsLib){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      }

      function showError(text){
        err.hidden = false;
        err.textContent = text;
      }

      function validFile(file){
        var path = String(file || "");
        return path.indexOf("disclosure-pdfs/") === 0 && path.indexOf("..") < 0 && /\.pdf$/i.test(path);
      }

      function unpack(raw){
        if(!raw) return [];
        try{
          var s = String(raw).replace(/-/g, "+").replace(/_/g, "/");
          while(s.length % 4) s += "=";
          var json = decodeURIComponent(escape(atob(s)));
          var rows = JSON.parse(json);
          if(!Array.isArray(rows)) return [];
          return rows.map(function(row){
            return { id: row[0], company: row[1], title: row[2], file: row[3] };
          }).filter(function(row){ return row && validFile(row.file); });
        }catch(_e){
          return [];
        }
      }

      function heading(doc){
        var title = doc.title || "גילוי נאות";
        return doc.company ? doc.company + " · " + title : title;
      }

      function watch(section, doc){
        if(section.getAttribute("data-seen") === "1") return;
        function seen(){
          if(section.getAttribute("data-seen") === "1") return;
          section.setAttribute("data-seen", "1");
          mark(doc.id);
        }
        if(typeof IntersectionObserver !== "function"){
          seen();
          return;
        }
        var obs = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(!entry.isIntersecting) return;
            seen();
            obs.disconnect();
          });
        }, { threshold: 0.15 });
        obs.observe(section);
      }

      function render(){
        var gen = ++renderGen;
        list.innerHTML = "";
        err.hidden = true;
        if(!docs.length){
          showError("לא נמצאו מסמכי גילוי נאות בלינק הזה.");
          return;
        }
        lead.textContent = docs.length === 1
          ? "מסמך הגילוי נאות מופיע כאן. אפשר לגלול ולקרוא אותו."
          : "כל המסמכים מופיעים כאן אחד אחרי השני. אפשר לגלול ולראות את כולם.";
        docs.forEach(function(doc){
          var section = document.createElement("section");
          section.className = "doc";
          var title = document.createElement("h2");
          title.textContent = heading(doc);
          var pages = document.createElement("div");
          pages.className = "pages";
          var wait = document.createElement("p");
          wait.className = "wait";
          wait.textContent = "טוען את המסמך…";
          section.appendChild(title);
          section.appendChild(wait);
          section.appendChild(pages);
          list.appendChild(section);
          watch(section, doc);
          doc._pages = pages;
          doc._wait = wait;
        });
        paintAll(gen);
      }

      function client(){
        if(!window.supabase || typeof window.supabase.createClient !== "function") return null;
        return window.supabase.createClient(URL, KEY, { auth: { persistSession: false } });
      }

      async function mark(docId){
        var sb = client();
        if(!sb || !(/^[a-f0-9]{32}$/.test(token) || /^1[a-z0-9]{8}$/.test(token))) return null;
        try{
          var res = await sb.rpc("onyx_disclosure_link_open", { p_token: token, p_doc: docId || null });
          return res && res.data ? res.data : null;
        }catch(_e){
          return null;
        }
      }

      function applyServer(data){
        if(!data || data.ok !== true || !Array.isArray(data.docs) || !data.docs.length) return false;
        var next = data.docs.filter(function(doc){ return doc && validFile(doc.file); });
        if(!next.length) return false;
        docs = next;
        return true;
      }

      async function paintDoc(doc, gen){
        var pdf = null;
        try{
          if(!window.pdfjsLib || typeof window.pdfjsLib.getDocument !== "function") throw new Error("pdf");
          var task = window.pdfjsLib.getDocument({ url: doc.file });
          pdf = await task.promise;
          if(gen !== renderGen || !doc._pages) return;
          var width = Math.max(280, doc._pages.clientWidth || list.clientWidth || 640);
          var dpr = pdf.numPages > 8 ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
          for(var i = 1; i <= pdf.numPages; i++){
            if(gen !== renderGen) return;
            var page = await pdf.getPage(i);
            if(gen !== renderGen) return;
            var base = page.getViewport({ scale: 1 });
            var viewport = page.getViewport({ scale: width / base.width });
            var canvas = document.createElement("canvas");
            canvas.dir = "ltr";
            canvas.width = Math.max(1, Math.floor(viewport.width * dpr));
            canvas.height = Math.max(1, Math.floor(viewport.height * dpr));
            var ctx = canvas.getContext("2d", { alpha: false });
            if(ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            doc._pages.appendChild(canvas);
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            if(doc._wait) doc._wait.hidden = true;
            await new Promise(function(resolve){
              if(typeof requestAnimationFrame === "function") requestAnimationFrame(function(){ resolve(); });
              else setTimeout(resolve, 0);
            });
          }
        }catch(_e){
          if(gen !== renderGen || !doc._wait) return;
          doc._wait.hidden = false;
          doc._wait.textContent = "לא ניתן להציג את המסמך הזה.";
        }finally{
          try{ if(pdf && pdf.destroy) await pdf.destroy(); }catch(_e2){}
        }
      }

      async function paintAll(gen){
        for(var i = 0; i < docs.length; i++){
          if(gen !== renderGen) return;
          await paintDoc(docs[i], gen);
        }
      }

      docs = unpack(params.get("d"));
      render();
      mark(null).then(function(data){
        if(applyServer(data)) render();
        else if(!docs.length) showError("לא נמצאו מסמכי גילוי נאות בלינק הזה.");
      });
    })();
  </script>
</body>
</html>
